<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Той шақыру</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #fffaf3;
        --text: #3d2c24;
        --accent: #8f4f3b;
        --gold: #c7a35a;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #fffaf3 0%, #f5e5d5 100%);
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(100%, 760px);
        background: rgba(255,255,255,0.92);
        border: 1px solid rgba(199,163,90,0.35);
        border-radius: 32px;
        box-shadow: 0 24px 60px rgba(90,58,44,0.16);
        padding: 42px 28px;
        text-align: center;
      }
      .label { letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); font-size: 0.78rem; }
      h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(2.2rem, 4.6vw, 3.2rem);
        margin: 12px 0 10px;
        color: var(--accent);
      }
      .date { font-size: 1.1rem; color: #6f5448; margin: 8px 0; }
      .host { font-weight: 700; color: var(--gold); margin-top: 14px; }
      .ornament {
        margin: 18px 0;
        display: flex; justify-content: center; align-items: center; gap: 12px;
      }
      .ornament::before, .ornament::after {
        content: ''; width: 70px; height: 1px; background: var(--gold);
      }
      .ornament span {
        font-size: 1.4rem; color: var(--gold);
      }
      .btn {
        display: inline-block; margin-top: 20px; padding: 12px 24px; border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), #b56649); color: white; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="label">Тойға шақыру</div>
        <div class="ornament"><span>✧</span></div>
        <h1>Есенжан &amp; Жәннәт</h1>
        <p class="date">2026 жылы 8 тамыз • 16:00</p>
        <p class="host">Той иелері: Қайрат пен Бақыт</p>
        <p>«Алтын Бақа» мейрамханасы, Астана</p>
        <a class="btn" href="index.html">Бастапқы нұсқа</a>
      </div>
    </div>
  </body>
</html>
