  <script>
    // Музыка басқару
    const preloader = document.getElementById('preloader');
    const openBtn = document.getElementById('openBtn');
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');

    function toggleMusic() {
      if (music.paused) {
        music.currentTime = 21; // Начинаем с 21 секунды
        music.play().catch(err => console.log("Музыка қосылмады:", err));
        musicBtn.textContent = '⏸';
      } else {
        music.pause();
        musicBtn.textContent = '🎵';
      }
    }

    musicBtn.addEventListener('click', toggleMusic);

    openBtn.addEventListener('click', () => {
      preloader.classList.add('hidden');
      music.currentTime = 21; // Начинаем с 21 секунды при открытии
      music.play().catch(err => console.log("Аўтоматты аўу сәтсіз болды:", err));
      musicBtn.textContent = '⏸';
    });

    // Таймер — 7 август 2026
    const targetDate = new Date('August 7, 2026 17:00:00').getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;
      if (diff <= 0) return;
      
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Плавное появление блоков при прокрутке
    const reveals = document.querySelectorAll('.fade-in-section');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });
    reveals.forEach(r => observer.observe(r));
  </script>
